const variant=new URLSearchParams(location.search).get('variant')||'A';
const history=[{text:'我们先看一下录音时的小窗。',source:'system',time:'12:08'},{text:'我希望小窗和大窗都能看到字幕。',source:'mic',time:'12:14'},{text:'对，不用展开，也知道刚刚说了什么。',source:'system',time:'12:22'}];
const scripts={conversation:[{source:'mic',text:'这样开会的时候，就不用一直切回资料库。'},{source:'system',text:'展开以后，可以往上翻前面说过的内容。'},{source:'mic',text:'对，收起来也保留当前这句话。'},{source:'system',text:'那我们把当前句和已经说完的句子区分开。'},{source:'mic',text:'可以，正在识别的内容更新，前面的文字尽量稳定。'},{source:'system',text:'如果网络断了，录音还是继续，字幕提示一下就好。'}],long:[{source:'system',text:'我们这周先完成大小窗的字幕体验，下周再验证长会议、网络重连和不同音源的表现。',draft:'我们这周先完成大小窗的字幕体验，下周再验证长会意、网络重连和不同音源的表现。'},{source:'mic',text:'还有一个细节：识别模型会修正刚说过的话，所以文字应该原地更新，不要重复增加一行。'},{source:'system',text:'比如刚刚的“长会意”，会在句末修正成“长会议”。'}]};
let state={variant,expanded:false,pinned:true,libraryFront:false,recording:true,paused:false,scenario:'conversation',offline:false,following:true,filter:'all',current:'这样开会的时候',currentSource:'mic',finalized:false,history:history.map(x=>({...x})),scriptIndex:0,chars:7,phase:0,ticks:0,elapsed:752,library:true,dragged:false};
const panel=document.querySelector('#panel');let interval=0,simulationTicks=0;
const tail=(text,length)=>Array.from(text).length>length?'…'+Array.from(text).slice(-length).join(''):text;
const escape=text=>text.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clock=()=>`${Math.floor(state.elapsed/60).toString().padStart(2,'0')}:${Math.floor(state.elapsed%60).toString().padStart(2,'0')}`;
function report(){window.reportState({...state,shape:state.expanded?'大窗':'小窗',simulation:'文字与录音状态均为模拟，不访问麦克风或云端',current:state.current,history:state.history.map(x=>({...x}))});}
function status(){return state.offline?'<span class="network-warning"><i></i>字幕连接中，录音继续</span>':'';}
function caption(text,compact=0){return `<span class="current-caption ${state.finalized?'':'partial'}">${escape(compact?tail(text,compact):text)}</span>`;}
function footer(){return `<footer class="live-footer"><span class="recording-dot"></span><span class="clock">${clock()}</span>${wave()}<span class="spacer"></span>${status()}${stop()}</footer>`;}
function utterances(kind='normal'){let rows=state.history.map(x=>({...x,current:false}));rows.push({text:state.current,source:state.currentSource,time:clock(),current:true});if(variant==='C'&&state.filter!=='all')rows=rows.filter(x=>x.source===state.filter);return rows.map(x=>`<div class="utterance ${x.current?'current ':''}${x.source==='mic'?'mic':''}" data-current="${x.current}">${variant==='C'?`<div class="row">${source(x.source)}<span class="stamp">${x.time}</span></div>`:`<span class="stamp">${x.time}</span>`}<p>${x.current?caption(x.text):escape(x.text)}</p></div>`).join('');}
function A(){return state.expanded?`<header class="sheet-header drag-zone"><span class="recording-dot"></span><strong>实时字幕</strong>${button('copy','复制已定稿字幕','copy')}${pin()}${button('resize','收起字幕窗','up')}</header><div class="transcript-scroll" data-scroll>${utterances()}</div>${footer()}`:`<header class="strip-head drag-zone"><span class="clock">${clock()}</span>${wave()}${state.offline?'<span class="network-warning" role="status" aria-label="字幕连接中，录音继续" title="字幕连接中，录音继续"><i></i></span>':''}<span class="spacer"></span>${stop()}${pin()}${button('resize','展开字幕窗','down')}</header><div class="glance" data-current="true">${caption(state.current,14)}</div>`;}
function B(){return state.expanded?`<header class="card-top drag-zone"><span class="focus-title"><i class="recording-dot"></i> 实时字幕</span><span>${button('copy','复制已定稿字幕','copy')}${button('resize','收起字幕窗','up')}</span></header><div class="quiet-history" data-scroll>${state.history.map(x=>`<div class="utterance"><span class="stamp">${x.time}</span><p>${escape(x.text)}</p></div>`).join('')}</div><div class="focus-now"><div class="source"><i></i>当前发言</div><div data-current="true">${caption(state.current)}</div></div>${footer()}`:`<header class="card-top drag-zone">${state.offline?'<span class="network-warning"><i></i>字幕连接中</span>':source(state.currentSource)}${button('resize','展开字幕窗','expand')}</header><div class="focus-copy" data-current="true">${caption(state.current,27)}</div><footer class="live-footer"><span class="clock">${clock()}</span>${wave()}<span class="spacer"></span>${stop()}</footer>`;}
function C(){if(state.expanded)return `<header class="side-head drag-zone"><span class="recording-dot"></span><strong>产品设计讨论</strong>${button('copy','复制已定稿字幕','copy')}${button('resize','收起字幕窗','down')}</header><nav class="filters" aria-label="字幕音源筛选">${[['all','全部'],['mic','麦克风'],['system','系统音频']].map(([k,v])=>`<button data-filter="${k}" class="${state.filter===k?'active':''}" aria-pressed="${state.filter===k}">${v}</button>`).join('')}</nav><div class="transcript-scroll" data-scroll>${utterances()}</div>${footer()}`;
const lastFor=name=>state.currentSource===name?state.current:[...state.history].reverse().find(x=>x.source===name)?.text||'等待发言';return `<header class="lane-top drag-zone"><span class="recording-dot"></span><span class="clock">${clock()}</span>${wave()}${state.offline?'<span class="network-warning"><i></i>字幕连接中</span>':''}${button('resize','展开字幕窗','up')}</header><div class="lanes"><div class="lane-lines">${['system','mic'].map(k=>`<div class="lane-line ${state.currentSource===k?'active':''}">${source(k)}<span class="line" data-lane="${k}">${escape(tail(lastFor(k),28))}</span></div>`).join('')}</div>${stop()}</div>`;}
function render(keepScroll=false){const old=panel.querySelector('[data-scroll]');const scroll=old?.scrollTop||0;panel.className=`panel ${variant.toLowerCase()} ${state.expanded?'expanded':''} ${state.offline?'offline':''}`;panel.innerHTML=({A,B,C}[variant]||A)();panel.hidden=!state.recording;if(state.paused)panel.classList.add('paused');const scroller=panel.querySelector('[data-scroll]');if(scroller){scroller.scrollTop=state.following?scroller.scrollHeight:(keepScroll?scroll:0);scroller.addEventListener('scroll',()=>{const following=scroller.scrollHeight-scroller.scrollTop-scroller.clientHeight<24;if(following!==state.following){state.following=following;updateFollow();report();}},{passive:true});}updateFollow();updateLayer();clampPanel();report();}
function updateFollow(){panel.querySelector('.follow')?.remove();if(state.expanded&&!state.following){const follow=document.createElement('button');follow.className='follow';follow.dataset.action='follow';follow.innerHTML=icon('down')+'回到最新';panel.append(follow);}}
function updateText(){if(variant==='C'&&!state.expanded){for(const name of ['system','mic']){const node=panel.querySelector(`[data-lane="${name}"]`);const row=node?.closest('.lane-line');row?.classList.toggle('active',state.currentSource===name);const text=state.currentSource===name?state.current:[...state.history].reverse().find(x=>x.source===name)?.text||'等待发言';if(node)node.textContent=tail(text,28);}}else{const node=panel.querySelector('[data-current="true"]');if(node){let target=node.matches('.utterance')?node.querySelector('p'):node;target.innerHTML=caption(state.current,!state.expanded?(variant==='A'?14:27):0);}}panel.querySelectorAll('.clock').forEach(n=>n.textContent=clock());const scroller=panel.querySelector('[data-scroll]');if(scroller&&state.following)scroller.scrollTop=scroller.scrollHeight;report();}
function tick(){if(!state.recording||state.paused)return;state.ticks++;if(state.ticks%5===0)state.elapsed++;simulationTicks++;if(state.scenario==='network'&&simulationTicks===12){state.offline=true;render(true);}if(state.scenario==='network'&&simulationTicks===54){state.offline=false;render(true);}if(state.offline){updateText();return;}const sequence=scripts[state.scenario==='long'?'long':'conversation'];const turn=sequence[state.scriptIndex%sequence.length];state.currentSource=turn.source;if(state.phase===0){const draft=turn.draft||turn.text;state.chars=Math.min(draft.length,state.chars+1);state.current=draft.slice(0,state.chars);state.finalized=false;if(state.chars===draft.length)state.phase=1;}else if(state.phase<9){state.phase++;if(state.phase===5){state.current=turn.text;state.finalized=true;}}else{state.history.push({text:turn.text,source:turn.source,time:clock()});state.scriptIndex++;state.chars=1;state.phase=0;state.current=sequence[state.scriptIndex%sequence.length].text.slice(0,1);state.currentSource=sequence[state.scriptIndex%sequence.length].source;state.finalized=false;render(true);return;}updateText();}
function restart(){state.recording=true;state.libraryFront=false;state.current='这样开会的时候';state.currentSource='mic';state.history=history.map(x=>({...x}));state.scriptIndex=0;state.chars=7;state.phase=0;state.ticks=0;state.elapsed=752;state.following=true;state.filter='all';state.offline=false;state.paused=false;state.finalized=false;simulationTicks=0;document.querySelector('#toast').hidden=true;document.querySelector('#playSimulation').textContent='暂停演示';document.querySelector('#mainRecord').innerHTML='<i></i><span>录音中</span>';document.querySelector('#recordList .record-row span').textContent='正在录制';document.querySelector('#recordMeta').textContent='09:30　·　12:32　·　系统音频与麦克风';if(state.scenario==='long'){state.current=scripts.long[0].text.slice(0,7);state.currentSource='system';}render();}
function stopRecording(){state.recording=false;panel.hidden=true;updateLayer();document.querySelector('#mainRecord').innerHTML='<i></i><span>开始录音</span>';document.querySelector('#toast').hidden=false;document.querySelector('#recordList .record-row span').textContent=clock()+'　·　字幕已保存';document.querySelector('#recordMeta').textContent=`刚刚　·　${clock()}　·　字幕已保存`;document.querySelector('#libraryTranscript').textContent=[...state.history.map(x=>x.text),state.current].join(' ');report();}
function toggleLibrary(){state.library=!state.library;state.libraryFront=false;updateLayer();document.querySelector('#library').classList.toggle('closed',!state.library);document.querySelector('#openLibrary').hidden=state.library;report();}
function updateLayer(){panel.classList.toggle('unpinned',variant==='A'&&!state.pinned);document.querySelector('#library').classList.toggle('front',state.libraryFront&&state.library&&state.recording);document.querySelector('#showCaptions').hidden=!(state.libraryFront&&state.library&&state.recording);}
function showCaptions(){state.libraryFront=false;updateLayer();report();}
function focusLibrary(){if(variant==='A'&&!state.pinned&&state.recording){state.libraryFront=true;updateLayer();report();}}
document.querySelector('#library').addEventListener('pointerdown',focusLibrary);document.querySelector('#library').addEventListener('focusin',focusLibrary);document.querySelector('#showCaptions').onclick=showCaptions;
function clampPanel(){if(!state.dragged)return;const r=panel.getBoundingClientRect();panel.style.left=Math.max(12,Math.min(r.left,innerWidth-r.width-12))+'px';panel.style.top=Math.max(80,Math.min(r.top,innerHeight-r.height-101))+'px';}
panel.addEventListener('click',async event=>{const filter=event.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;render();return;}const action=event.target.closest('[data-action]')?.dataset.action;if(action==='resize'){state.expanded=!state.expanded;state.following=true;render();}if(action==='pin'){state.pinned=!state.pinned;state.libraryFront=false;render(true);}if(action==='stop')stopRecording();if(action==='follow'){state.following=true;const scroller=panel.querySelector('[data-scroll]');if(scroller)scroller.scrollTop=scroller.scrollHeight;updateFollow();report();}if(action==='copy'){await navigator.clipboard.writeText(state.history.map(x=>`${x.time} ${x.text}`).join('\n'));const b=event.target.closest('button');b.innerHTML=icon('check');b.classList.add('copied');b.setAttribute('aria-label','字幕已复制');}});
let dragging=null;
panel.addEventListener('pointerdown',event=>{if(state.libraryFront)showCaptions();if(!event.target.closest('.drag-zone')||event.target.closest('button'))return;const r=panel.getBoundingClientRect();dragging={dx:event.clientX-r.left,dy:event.clientY-r.top};panel.setPointerCapture(event.pointerId);panel.style.transition='none';event.preventDefault();});
panel.addEventListener('pointermove',event=>{if(!dragging)return;state.dragged=true;panel.style.transform='none';panel.style.right='auto';panel.style.bottom='auto';panel.style.left=Math.max(12,Math.min(event.clientX-dragging.dx,innerWidth-panel.offsetWidth-12))+'px';panel.style.top=Math.max(80,Math.min(event.clientY-dragging.dy,innerHeight-panel.offsetHeight-101))+'px';});
panel.addEventListener('pointerup',()=>{if(dragging){dragging=null;panel.style.transition='';report();}});
document.querySelector('#scenario').onchange=event=>{state.scenario=event.target.value;restart();};document.querySelector('#playSimulation').onclick=()=>{state.paused=!state.paused;document.querySelector('#playSimulation').textContent=state.paused?'继续演示':'暂停演示';panel.classList.toggle('paused',state.paused);report();};document.querySelector('#replay').onclick=restart;document.querySelector('#mainRecord').onclick=()=>state.recording?stopRecording():restart();document.querySelector('#closeLibrary').onclick=toggleLibrary;document.querySelector('#openLibrary').innerHTML=icon('library')+'打开资料库';document.querySelector('#openLibrary').onclick=toggleLibrary;document.querySelector('#showSaved').onclick=()=>{if(!state.library)toggleLibrary();document.querySelector('#toast').hidden=true;document.querySelector('#recordTitle').textContent='产品设计讨论';report();};
document.querySelector('#allRecords').innerHTML=icon('list')+'所有录音';document.querySelector('#starredRecords').innerHTML=icon('star')+'已标记';document.querySelector('#recordList').innerHTML=['产品设计讨论','需求评审','与设计师的一次对话'].map((t,i)=>`<div class="record-row ${i===0?'selected':''}"><div class="tiny-wave">${[9,18,11,25,13,8,17].map(h=>`<i style="--h:${h}px"></i>`).join('')}</div><div><strong>${t}</strong><span>${i===0?'正在录制':['','09:03','08:46'][i]+'　·　'+(12+i*8)+':32'}</span></div></div>`).join('');for(const id of ['waveform','waveform2'])document.querySelector('#'+id).innerHTML=Array.from({length:210},(_,i)=>`<i style="--h:${5+Math.abs(Math.sin(i*1.79)*Math.cos(i*.25))*54}px"></i>`).join('');document.querySelector('#designNote').innerHTML=`<b>${note[variant]?.[0]}</b>${note[variant]?.[1]}`;window.addEventListener('resize',clampPanel);render();interval=setInterval(tick,200);
</script>
</body>
</html>
