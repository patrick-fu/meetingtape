<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeetingTape · 界面探索</title><link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#272a31;background:#e9e9e6}button,a{font:inherit}button{cursor:pointer}iframe{display:block;border:0;width:100vw;height:100dvh}.identity{position:fixed;top:22px;left:26px;z-index:20;display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid #fff8;border-radius:11px;background:#fff9;backdrop-filter:blur(24px);box-shadow:0 2px 15px #00000004;font-size:12px}.identity strong{letter-spacing:-.3px}.identity span{color:#787c84;font-size:11px}.identity button{background:none;border:0;color:#6d737d;padding:0 0 0 10px;border-left:1px solid #c9cbd0;font-size:11px}.switcher{position:fixed;z-index:20;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center;padding:7px;background:#22252bf0;color:white;border:1px solid #ffffff24;border-radius:17px;box-shadow:0 12px 35px #11182728;backdrop-filter:blur(30px)}.switcher button{border:0;background:none;color:#b9bdc7;padding:11px 15px;border-radius:10px;white-space:nowrap;font-size:12px;transition:.18s}.switcher button:hover{background:#ffffff0e;color:white}.switcher button[aria-current=true]{background:#fff;color:#20242d;box-shadow:0 2px 6px #0002}.switcher .arrow{font-size:19px;padding:6px 11px;line-height:28px}.switcher .sep{height:19px;width:1px;background:#ffffff23;margin:0 2px}.panel{position:fixed;z-index:30;left:26px;top:77px;width:330px;padding:23px;border:1px solid #ffffffa1;background:#fffffff2;box-shadow:0 20px 70px #23304c29;border-radius:17px;backdrop-filter:blur(30px)}.panel[hidden],.state[hidden]{display:none}.panel h2{margin:0 0 11px;font-size:15px}.panel p{font-size:12px;color:#68717f;line-height:1.8;margin:0 0 17px}.panel a{display:block;font-size:12px;color:#4668a0;text-decoration:none;line-height:2}.panel small{display:block;color:#969ba3;font-size:10px;border-top:1px solid #eee;margin-top:17px;padding-top:13px;line-height:1.7}.state-toggle{position:fixed;right:25px;top:24px;z-index:20;font-size:11px;background:#ffffff9c;border:1px solid #fff6;border-radius:9px;padding:9px 11px;color:#757b84;backdrop-filter:blur(24px)}.state{position:fixed;right:25px;top:66px;z-index:30;max-width:390px;max-height:65vh;overflow:auto;background:#20252cf5;color:#d6dfde;border:1px solid #ffffff30;border-radius:13px;padding:19px;font:11px/1.7 ui-monospace,monospace;white-space:pre-wrap;box-shadow:0 16px 40px #0002}@media(max-width:740px){.switcher{max-width:96vw;gap:1px;bottom:12px;border-radius:13px;padding:5px}.switcher button{font-size:10px;padding:10px 8px}.switcher .arrow{padding:5px}.identity{top:12px;left:12px}.identity span{display:none}.state-toggle{right:12px;top:13px}.panel{left:12px;top:64px;max-width:calc(100vw - 24px)}}
  </style>
</head>
<body>
  <iframe id="canvas" title="MeetingTape 方案 A"></iframe>
  <div class="identity"><strong>MeetingTape</strong><span>界面探索 · 交互演示</span><button id="reference" aria-expanded="false">设计参考 ↗</button><button id="stateToggle" aria-expanded="false">演示状态</button></div>
  <pre class="state" id="state" hidden></pre>
  <aside class="panel" id="referencePanel" hidden><h2 id="variantTitle"></h2><p id="variantIdea"></p><a id="source" target="_blank" rel="noreferrer"></a><small>录音使用内存中的演示数据。试听与导出为本地生成的示例音频。</small></aside>
  <nav class="switcher" aria-label="原型方案切换"><button class="arrow" id="prev" aria-label="上一个方案">‹</button><span class="sep"></span><button data-variant="A">A 资料库</button><button data-variant="B">B 菜单栏</button><button data-variant="C">C 录音机</button><button data-variant="D">D 启动器</button><button data-variant="E">E 伴随条</button><button data-variant="F">F 融合方案</button><span class="sep"></span><button class="arrow" id="next" aria-label="下一个方案">›</button></nav>
  <script>
    const study=new URL(location.href).searchParams.get('study'); const captionStudy=study==='captions'; const variants=captionStudy?{A:{name:'轻字幕条',idea:'小窗用一行读当前句，展开后沿时间顺序阅读历史；字幕在两种尺寸中连续更新。',source:'大小窗字幕 · 模拟交互',url:null},B:{name:'两行字幕卡',idea:'小窗容纳两行，大窗弱化历史、聚焦当前发言，适合一边工作一边跟随。',source:'大小窗字幕 · 模拟交互',url:null},C:{name:'双音源字幕',idea:'小窗分别呈现系统音频与麦克风的最新内容，大窗按音源筛选和回看。',source:'大小窗字幕 · 模拟交互',url:null}}:{A:{name:'资料库工作台',idea:'把录音当作可整理、可回听的文件。主窗口承载完整上下文，适合常驻管理。',source:'Apple · Mac 语音备忘录',url:'https://support.apple.com/guide/voice-memos/welcome/mac'},B:{name:'菜单栏速录',idea:'录音随叫随到，结束即收起。设置与最近录音留在一个轻量下拉面板里。',source:'CleanShot · 即时捕获工具',url:'https://cleanshot.com/'},C:{name:'桌面录音机',idea:'让音源、电平和录制动作像一台摸得着的设备。双声源的工作状态一眼可见。',source:'Rogue Amoeba · Piezo',url:'https://rogueamoeba.com/piezo/'},D:{name:'键盘启动器',idea:'一个输入框调出录音和文件操作。用键盘完成大部分动作，录音时收成小浮层。',source:'Raycast · Search Bar',url:'https://manual.raycast.com/search-bar'},E:{name:'悬浮伴随条',idea:'会议继续，录音退到一旁。可拖动的轻量控件只留下正在发生的事。',source:'Superwhisper · 全局快捷入口',url:'https://superwhisper.com/'},F:{name:'资料库与悬浮窗',idea:'资料库负责整理，独立悬浮窗负责录制。收起时仅保留时间、波形、停止与展开；关闭资料库后录音继续，停止后自动入库。',source:'豆包 · 用户提供的录音悬浮窗截图',url:null}};
    const keys=Object.keys(variants),frame=document.querySelector('#canvas');let current='A'; if(captionStudy){document.querySelector('.identity span').textContent='大小窗字幕 · 模拟演示';document.querySelector('#reference').textContent='方案说明'; document.querySelectorAll('[data-variant]').forEach(b=>{b.hidden=!variants[b.dataset.variant];if(variants[b.dataset.variant])b.textContent=b.dataset.variant+' '+variants[b.dataset.variant].name;});document.querySelector('.panel small').textContent='文字、音源与录音为模拟数据。本页不调用麦克风或云端接口；系统全局置顶仍由原生 App 验收。';}
    function show(key){current=variants[key]?key:'A';const v=variants[current],url=new URL(location.href);url.searchParams.set('variant',current);history.replaceState(null,'',url);frame.src=captionStudy?`captions.html?variant=${current}`:`variants/${current.toLowerCase()}.html`;frame.title=`MeetingTape 方案 ${current} · ${v.name}`;document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.variant===current)));document.querySelector('#variantTitle').textContent=current+' · '+v.name;document.querySelector('#variantIdea').textContent=v.idea;const source=document.querySelector('#source');source.textContent=v.source+(v.url?' ↗':'');if(v.url)source.href=v.url;else source.removeAttribute('href');document.title=`MeetingTape · ${v.name}`;document.querySelector('#state').textContent='等待界面状态…';console.info('MeetingTape prototype', {variant:current,name:v.name,status:'loading'});}
    function cycle(direction){show(keys[(keys.indexOf(current)+direction+keys.length)%keys.length]);}
    document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>show(b.dataset.variant));document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);
    document.querySelector('#reference').onclick=()=>{const panel=document.querySelector('#referencePanel');panel.hidden=!panel.hidden;document.querySelector('#reference').setAttribute('aria-expanded',!panel.hidden);};
    document.querySelector('#stateToggle').onclick=()=>{const state=document.querySelector('#state');state.hidden=!state.hidden;document.querySelector('#stateToggle').setAttribute('aria-expanded',!state.hidden);};
    document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();cycle(event.key==='ArrowRight'?1:-1);}});
    window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow)return;if(event.data.type==='meetingtape:cycle')cycle(event.data.direction);if(event.data.type==='meetingtape:state'&&event.data.state.variant===current){document.querySelector('#state').textContent=JSON.stringify(event.data.state,null,2);console.info('MeetingTape state',event.data.state);}});
    frame.onload=()=>frame.contentWindow.postMessage({type:'meetingtape:request-state'},location.origin);show(new URL(location.href).searchParams.get('variant')||'A');
  </script>
</body>
</html>
