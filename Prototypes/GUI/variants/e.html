<head>

<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#333631;background:#e9e7df}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e19c64;outline-offset:3px}.desktop{position:absolute;inset:0;background:radial-gradient(ellipse at 90% 0%,#e9d4bc66,transparent 70%),#e9e7df}.call{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(850px,78vw);height:486px;border:1px solid #fff9;border-radius:17px;background:#fafaf6;box-shadow:0 22px 50px #474f3c0e;overflow:hidden}.chrome{height:47px;border-bottom:1px solid #e9e9e2;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#91938c;font-size:11px}.lights{display:flex;gap:7px}.lights i{width:9px;height:9px;border-radius:50%;background:#e4e5dd}.call-content{padding:27px 32px;display:grid;grid-template-columns:1.7fr 1fr;gap:30px}.call h1{font-size:21px;letter-spacing:-.6px;margin:0 0 7px;font-weight:550}.muted{color:#969a91;font-size:11px}.participants{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}.participant{height:125px;border-radius:13px;display:flex;justify-content:center;align-items:center;position:relative;background:#e8ebe0}.participant:nth-child(2){background:#e9e4d9}.participant:nth-child(3){background:#e5e9e7}.participant:nth-child(4){background:#ede5df}.avatar{height:56px;width:56px;border-radius:50%;background:#c5d0b7;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500;color:#fff}.participant:nth-child(2) .avatar{background:#c0ae96}.participant:nth-child(3) .avatar{background:#a8bdba}.participant:nth-child(4) .avatar{background:#c4ad9e}.participant small{position:absolute;left:12px;bottom:10px;color:#7b8172;font-size:10px}.agenda{border-left:1px solid #e8e9e2;padding:7px 0 0 25px}.agenda b{font-size:12px;font-weight:550}.agenda ol{padding-left:17px;margin-top:24px;font-size:12px;line-height:2.8;color:#a2a59d}.agenda .now{color:#76856c}.quiet-callbar{display:flex;gap:20px;justify-content:center;margin-top:22px;color:#c4c8bc}.quiet-callbar svg{height:17px;width:17px}.tape{position:absolute;left:50%;top:70%;transform:translateX(-50%);z-index:5}.bar{min-width:600px;height:92px;padding:16px 18px 16px 11px;background:#fffdf8f5;border:1px solid #ffffffcc;border-radius:23px;box-shadow:0 20px 60px #3d493f25,0 2px 4px #3d493f0a;backdrop-filter:blur(32px);display:flex;gap:16px;align-items:center;transition:width .25s}.handle{cursor:grab;display:flex;color:#c2c1b9;padding:12px 4px;touch-action:none;border:0;background:none}.handle:active{cursor:grabbing}.handle svg{width:12px}.brand{width:40px;height:40px;border-radius:13px;background:#f4e9dd;color:#b37c50;display:grid;place-items:center}.brand svg{width:24px;height:24px}.meta{min-width:122px}.meta strong{font-size:13px;font-weight:600}.status{display:flex;align-items:center;gap:5px;font-size:10px;color:#92998b;margin-top:7px}.dot{display:inline-block;width:5px;height:5px;background:#93ac86;border-radius:50%}.live .dot{background:#db684f;animation:pulse 1.7s infinite}.time{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";font-size:25px;letter-spacing:-1px;font-weight:450;min-width:76px;color:#3c4239}.wave{display:flex;gap:3px;align-items:center;height:34px;width:65px;justify-content:center}.wave i{width:3px;height:var(--h);border-radius:5px;background:#bec8af;transform:scaleY(.3);transition:background .3s}.live .wave i{background:#7d9370;animation:meter 1.3s var(--d) infinite ease-in-out}.primary{height:45px;min-width:113px;display:flex;align-items:center;justify-content:center;gap:9px;background:#363e34;border:1px solid #363e34;border-radius:13px;color:#fff;font-size:12px;padding:0 16px;white-space:nowrap}.primary .record{width:9px;height:9px;border-radius:50%;background:#e99b88;box-shadow:0 0 0 3px #e99b881c}.live .primary{background:#f7e9e2;color:#a7523c;border-color:#e9c8b9}.live .primary .record{border-radius:2px;background:#bb654c;box-shadow:none}.tools{display:flex;gap:2px;border-left:1px solid #eeeae0;padding-left:9px}.iconbtn{display:grid;place-items:center;width:29px;height:33px;background:none;border:0;color:#8c9387;border-radius:8px}.iconbtn:hover,.iconbtn[aria-expanded=true]{background:#efefe7;color:#3a4435}.iconbtn svg{width:17px;height:17px}.sources{position:absolute;top:calc(100% + 12px);left:26px;right:26px;display:flex;justify-content:center;gap:18px;font-size:10px;color:#92998b}.sources span{display:flex;align-items:center;gap:5px}.sources svg{width:12px;height:12px}.sources .small-dot{width:4px;height:4px;border-radius:50%;background:#97a68a}.sheet{position:absolute;bottom:calc(100% + 14px);right:0;width:320px;background:#fffffcf7;backdrop-filter:blur(30px);border:1px solid #ffffffd9;box-shadow:0 16px 50px #3d493f1c;border-radius:18px;padding:20px}.sheet[hidden]{display:none}.sheet h2{font-size:13px;font-weight:600;margin:0 0 20px}.sheet label{display:block;font-size:11px;color:#92988d;margin:15px 0 7px}.sheet input[type=text],.sheet select{display:block;width:100%;border:1px solid #e7e9df;border-radius:8px;padding:10px 11px;background:#fafbf7;color:#4b5543;font-size:12px}.toggle-row{display:flex;justify-content:space-between;align-items:center;margin-top:19px;padding-top:17px;border-top:1px solid #eff0e9}.toggle-row label{margin:0;color:#6c7466}.toggle-row input{accent-color:#839976;width:15px;height:15px}.sheet .done{margin-top:20px;background:#edf1e7;color:#59694c;border:0;width:100%;border-radius:9px;padding:10px;font-size:11px}.history{width:347px;padding:21px 17px 9px}.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.history-head h2{margin:0}.history-head span{font-size:10px;color:#b0b5a8}.entry{padding:13px 4px;border-top:1px solid #eeefe8;display:flex;gap:10px;align-items:center}.file-icon{width:31px;height:34px;border:1px solid #e7e9df;border-radius:7px;color:#98a58c;display:grid;place-items:center}.file-icon svg{width:16px;height:16px}.entry-info{flex:1;min-width:0}.entry-info strong{display:block;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:198px}.entry-info small{display:block;font-size:9px;color:#a0a595;margin-top:6px}.entry button,.entry a{width:27px;height:27px;padding:5px;border:0;background:#f2f4ed;color:#859578;border-radius:50%;display:grid;place-items:center;text-decoration:none}.entry svg{width:13px;height:13px}.toast{position:absolute;left:50%;bottom:calc(100% + 16px);transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#53664a;background:#f9fcf5;border:1px solid #e1e9d8;box-shadow:0 5px 15px #00000007;border-radius:11px;padding:12px 19px}.toast[hidden]{display:none}.compact .bar{min-width:350px;height:66px;padding:10px 13px;gap:13px;border-radius:20px}.compact .brand,.compact .meta,.compact .sources,.compact .historyButton{display:none}.compact .time{font-size:23px;min-width:65px}.compact .primary{min-width:60px;height:36px;padding:0 12px}.compact .primary .button-label{display:none}.compact .wave{width:50px}.compact .tools{padding-left:5px}.compact .iconbtn{width:26px}.compact .sheet{right:0}.context-label{position:absolute;top:115px;left:50%;transform:translateX(-50%);font-size:10px;color:#a4a79c;letter-spacing:3px;text-transform:uppercase}@keyframes meter{0%,100%{transform:scaleY(.3)}40%{transform:scaleY(1)}70%{transform:scaleY(.6)}}@keyframes pulse{50%{opacity:.35}}@media(max-height:800px){.call{top:43%;height:414px}.call-content{padding-top:21px}.participant{height:101px}.tape{top:70%}.context-label{top:95px}.quiet-callbar{margin-top:18px}}@media(max-width:850px){.call{width:90vw}.call-content{grid-template-columns:1.4fr 1fr;gap:18px;padding:25px}.bar{min-width:570px;gap:11px}.meta{min-width:100px}.tape{max-width:96vw}}@media(max-width:620px){.bar{min-width:0;width:94vw;gap:9px;padding:12px}.brand{display:none}.meta{min-width:90px}.time{font-size:21px;min-width:60px}.wave{width:42px}.primary{min-width:90px;padding:0 10px}.tools{padding-left:3px}.handle{display:none}.agenda{display:none}.call-content{grid-template-columns:1fr}.call{top:44%}.tape{top:70%}.context-label{display:none}}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true"><symbol id="mic" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11v2a7 7 0 0 0 14 0v-2M12 20v2"/></symbol><symbol id="sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 8a6 6 0 0 1 0 8M20 5a10 10 0 0 1 0 14"/></symbol><symbol id="sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor" stroke="none"/><circle cx="16" cy="17" r="3" fill="currentColor" stroke="none"/></symbol><symbol id="history-icon" viewBox="0 0 24 24"><path d="M4 7a9 9 0 1 1-1 8M3 3v5h5M12 7v6l4 2"/></symbol><symbol id="play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></symbol><symbol id="pause" viewBox="0 0 24 24"><path d="M8 6v12M16 6v12" stroke-width="4"/></symbol><symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol><symbol id="grip" viewBox="0 0 24 24"><path d="M9 5h0M15 5h0M9 12h0M15 12h0M9 19h0M15 19h0" stroke-width="3"/></symbol><symbol id="collapse" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol><symbol id="camera" viewBox="0 0 24 24"><rect x="3" y="5" width="12" height="14" rx="3"/><path d="m15 10 6-4v12l-6-4"/></symbol></svg>
<div class="desktop" aria-hidden="true"><div class="context-label">让录音留在一旁</div><div class="call"><div class="chrome"><div class="lights"><i></i><i></i><i></i></div><span>周五产品评审</span><span>25:18</span></div><div class="call-content"><div><h1>每个好想法，都值得留下。</h1><span class="muted">4 位参会者 · 产品与设计</span><div class="participants"><div class="participant"><div class="avatar">陈</div><small>陈晨</small></div><div class="participant"><div class="avatar">P</div><small>Patrick</small></div><div class="participant"><div class="avatar">林</div><small>林悦</small></div><div class="participant"><div class="avatar">吴</div><small>吴桐</small></div></div></div><div class="agenda"><b>今天一起看</b><ol><li>回顾上周的反馈</li><li class="now">新一版交互方案</li><li>下一阶段安排</li></ol><div class="quiet-callbar"><svg><use href="#mic"/></svg><svg><use href="#camera"/></svg><svg><use href="#sound"/></svg></div></div></div></div></div>
<main class="tape" id="tape"><div class="toast" id="toast" role="status" hidden></div><section class="sheet" id="settings" hidden><h2>录音设置</h2><label for="title">名称</label><input id="title" type="text" value="周五产品评审" maxlength="48"><label for="folder">保存至</label><select id="folder"><option value="~/录音/MeetingTape">录音 / MeetingTape</option><option value="~/桌面">桌面</option><option value="~/下载">下载</option></select><div class="toggle-row"><label for="raw">保留原始麦克风</label><input id="raw" type="checkbox"></div><button class="done" id="settingsDone">完成</button></section><section class="sheet history" id="history" hidden><div class="history-head"><h2>最近录音</h2><span id="count"></span></div><div id="entries"></div></section><div class="bar"><button class="handle" id="handle" aria-label="拖动悬浮条"><svg><use href="#grip"/></svg></button><div class="brand"><svg><path d="M5 8v8M10 4v16M15 7v10M20 10v4"/></svg></div><div class="meta"><strong>MeetingTape</strong><div class="status"><span class="dot"></span><span id="status">准备就绪</span></div></div><div class="wave" id="wave" aria-hidden="true"></div><span class="time" id="time">00:00</span><button class="primary" id="record"><span class="record"></span><span class="button-label">开始录音</span></button><div class="tools"><button class="iconbtn historyButton" id="historyButton" aria-label="最近录音" aria-expanded="false"><svg><use href="#history-icon"/></svg></button><button class="iconbtn" id="settingsButton" aria-label="录音设置" aria-expanded="false"><svg><use href="#sliders"/></svg></button><button class="iconbtn" id="compactButton" aria-label="收起悬浮条"><svg><use href="#collapse"/></svg></button></div></div><div class="sources"><span><svg><use href="#sound"/></svg>系统音频 <i class="small-dot"></i></span><span><svg><use href="#mic"/></svg>外置麦克风 <i class="small-dot"></i></span></div></main>
<audio id="audio" src="../assets/sample-stereo.m4a" preload="metadata"></audio>
<script src="../bridge.js"></script>
<script>
const $=s=>document.querySelector(s),state={variant:'E',status:'ready',seconds:0,title:'周五产品评审',outputDirectory:'~/录音/MeetingTape',keepRaw:false,compact:false,playing:null,recordings:[{title:'设计同步会',duration:'23:42',when:'今天 10:30'},{title:'与工程团队对齐',duration:'38:16',when:'昨天 16:00'}]};let started=0,timer,toastTimer;const format=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'),icon=name=>`<svg><use href="#${name}"/></svg>`;
for(let i=0;i<14;i++){const b=document.createElement('i');b.style.setProperty('--h',(10+Math.sin(i*2.3)**2*24)+'px');b.style.setProperty('--d',(-i*.17)+'s');$('#wave').append(b);}
function report(){window.reportState({...state,recordings:state.recordings.map(x=>({...x}))});}function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2400);}
function sheet(which){for(const name of ['settings','history']){const open=name===which&&$('#'+name).hidden;$('#'+name).hidden=!open;$('#'+name+'Button').setAttribute('aria-expanded',open);}report();}
function render(){const live=state.status==='recording';$('#tape').classList.toggle('live',live);$('#tape').classList.toggle('compact',state.compact);$('#status').textContent=live?'正在录音':state.status==='saving'?'正在保存':'准备就绪';$('#time').textContent=format(state.seconds);$('#record .button-label').textContent=live?'停止录音':state.status==='saving'?'保存中…':'开始录音';$('#record').setAttribute('aria-label',live?'停止录音':'开始录音');$('#record').disabled=state.status==='saving';for(const id of ['title','folder','raw'])$('#'+id).disabled=state.status!=='ready';$('#compactButton').setAttribute('aria-label',state.compact?'展开悬浮条':'收起悬浮条');report();}
function entries(){const container=$('#entries');container.replaceChildren();$('#count').textContent=state.recordings.length+' 段';state.recordings.forEach((entry,i)=>{const row=document.createElement('div');row.className='entry';const file=document.createElement('div');file.className='file-icon';file.innerHTML=icon('sound');const text=document.createElement('div');text.className='entry-info';const title=document.createElement('strong');title.textContent=entry.title;const date=document.createElement('small');date.textContent=entry.when+' · '+entry.duration;text.append(title,date);const play=document.createElement('button');play.setAttribute('aria-label',(state.playing===i?'暂停 ':'播放 ')+entry.title);play.innerHTML=icon(state.playing===i?'pause':'play');play.onclick=()=>{const audio=$('#audio');if(state.playing===i){audio.pause();state.playing=null;}else{audio.currentTime=0;audio.play();state.playing=i;}entries();report();};const download=document.createElement('a');download.href='../assets/sample-stereo.m4a';download.download=entry.title+'.m4a';download.setAttribute('aria-label','导出 '+entry.title);download.innerHTML=icon('download');download.onclick=()=>{toast('已导出示例录音');report();};row.append(file,text,play,download);container.append(row);});}
$('#record').onclick=()=>{if(state.status==='ready'){state.status='recording';state.seconds=0;started=Date.now();$('#audio').pause();state.playing=null;$('#history').hidden=true;$('#settings').hidden=true;entries();timer=setInterval(()=>{state.seconds=Math.floor((Date.now()-started)/1000);render();},250);render();}else if(state.status==='recording'){clearInterval(timer);state.status='saving';render();setTimeout(()=>{state.recordings.unshift({title:state.title||'未命名录音',duration:format(state.seconds),when:'刚刚'});state.status='ready';state.compact=false;entries();render();toast('已保存 · '+(state.title||'未命名录音')+'.m4a');},850);}};
$('#title').oninput=e=>{state.title=e.target.value;report();};$('#folder').onchange=e=>{state.outputDirectory=e.target.value;report();};$('#raw').onchange=e=>{state.keepRaw=e.target.checked;report();};$('#settingsButton').onclick=()=>sheet('settings');$('#historyButton').onclick=()=>sheet('history');$('#settingsDone').onclick=()=>{$('#settings').hidden=true;$('#settingsButton').setAttribute('aria-expanded','false');report();};$('#compactButton').onclick=()=>{state.compact=!state.compact;render();};$('#audio').onended=()=>{state.playing=null;entries();report();};
let drag=null;$('#handle').onpointerdown=e=>{const r=$('#tape').getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};$('#handle').setPointerCapture(e.pointerId);};$('#handle').onpointermove=e=>{if(!drag)return;const el=$('#tape');el.style.transform='none';el.style.left=Math.max(10,Math.min(innerWidth-el.offsetWidth-10,e.clientX-drag.x))+'px';el.style.top=Math.max(80,Math.min(innerHeight-180,e.clientY-drag.y))+'px';};$('#handle').onpointerup=()=>{drag=null;report();};entries();render();
</script>
