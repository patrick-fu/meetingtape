rder-top:1px solid var(--line)}.record-command{min-height:62px}.record-command .command-icon{background:linear-gradient(145deg,#34313c,#2b2832);color:#9a8fa9}.recent-command-wrap{position:relative}.recent-command-wrap .command{padding-right:63px}.download{position:absolute;right:13px;top:20px;width:26px;height:26px;display:grid;place-items:center;color:#77717f;border-radius:5px;opacity:0;transition:opacity .1s}.recent-command-wrap:hover .download,.recent-command-wrap:focus-within .download{opacity:1}.download:hover{color:#e3dbea;background:#ffffff0b}.download svg{width:14px;height:14px}.divider{height:1px;background:var(--line);margin:10px 12px}.recording-banner{display:none;align-items:center;gap:10px;margin:0 12px 11px;padding:12px;border-radius:7px;background:#18171c;border:1px solid #ffffff06}.recording-banner .pulse{width:5px;height:5px;border-radius:50%;background:#eb9287;box-shadow:0 0 9px #f49b8860;animation:pulse 1.9s infinite}.recording-label{font-size:11px;color:#a099a8;flex:1}.recording-clock{font:12px ui-monospace,SFMono-Regular,monospace;color:#dfd8e6}.compact-button{background:none;display:flex;align-items:center;gap:5px;color:#88808f;padding:2px 0 2px 13px;margin-left:7px;border-left:1px solid #ffffff10;font-size:11px}.compact-button svg{width:13px;height:13px}.settings{display:none;margin:6px 12px 12px;border:1px solid #ffffff0b;border-radius:8px;overflow:hidden;background:#19181e70}.settings.open{display:block}.settings.open~.recent-group{display:none}.setting-row{padding:12px 13px;display:flex;align-items:center;gap:14px;min-height:48px}.setting-row+.setting-row{border-top:1px solid #ffffff08}.setting-label{color:#8f8799;font-size:11px;min-width:79px}.setting-row input,.setting-row select{border:0;border-radius:4px;outline:none;color:#d4cddc;background:#ffffff05;padding:6px 8px;flex:1;min-width:0;font-size:11px}.setting-row input:focus,.setting-row select:focus{box-shadow:0 0 0 1px #ac91d372}.setting-row select{appearance:auto;cursor:pointer}.raw-copy{font-size:11px;color:#c0b8c9;flex:1}.raw-hint{display:block;font-size:10px;color:#665e70;margin-top:4px}.switch{width:30px;height:18px;border-radius:20px;background:#4b4355;padding:2px;flex-shrink:0}.switch:after{content:"";display:block;width:14px;height:14px;background:#aaa0b4;border-radius:50%;transition:transform .15s}.switch.on{background:#a994d4}.switch.on:after{background:#25202e;transform:translateX(12px)}.empty{display:none;padding:25px 13px 35px;color:#776f82;font-size:12px}.footer{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:#15141a45;border-top:1px solid var(--line);height:47px}.footer-brand{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:600;letter-spacing:.3px;color:#827b8e}.footer-brand svg{width:14px;height:14px;color:#9a8daa}.footer-right{display:flex;align-items:center;gap:13px;font-size:10px;color:#6e6679}.footer-right span{display:flex;align-items:center;gap:5px}.footer-right kbd{font-family:inherit;color:#8b8296;font-size:11px}.footer-options{padding:0;background:none;color:#8b8296;font-size:10px;display:flex;gap:6px;align-items:center}.footer-options svg{width:12px;height:12px}.toast{height:23px;font-size:10px;color:#9587a5;position:absolute;top:calc(50% + 304px);left:0;right:0;text-align:center;pointer-events:none;opacity:0;transition:opacity .15s}.toast.visible{opacity:1}.compact-content{display:none;padding:22px 24px 24px}.compact-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:21px}.compact-title{font-size:12px;color:#bcb3c8;display:flex;gap:8px;align-items:center}.compact-dot{height:6px;width:6px;background:#f59687;border-radius:50%;box-shadow:0 0 10px #ea8e7666;animation:pulse 1.9s infinite}.expand{padding:4px;background:none;color:#857a91}.expand svg{height:16px;width:16px}.compact-middle{display:flex;align-items:center;justify-content:space-between}.compact-time{font:35px ui-monospace,SFMono-Regular,monospace;font-weight:300;letter-spacing:-1.5px;color:#eee7f4}.waveform{display:flex;gap:3px;height:30px;align-items:center;margin-left:auto;margin-right:30px}.waveform i{width:2px;height:var(--h);background:#b9a4d0;border-radius:4px;animation:wave .8s ease-in-out infinite alternate;animation-delay:var(--d)}.compact-stop{background:#ffffff0b;border:1px solid #ffffff13;border-radius:8px;display:flex;align-items:center;gap:8px;padding:12px 15px;font-size:12px}.compact-stop:hover{background:#ffffff12}.compact-stop .stop-square{height:8px;width:8px;background:#f19a8c;border-radius:2px}.compact-sources{margin-top:23px;display:flex;align-items:center;gap:18px;color:#8c8298;font-size:10px}.compact-sources span{display:flex;align-items:center;gap:5px}.compact-sources i{width:4px;height:4px;background:#b4c89c;border-radius:50%}.compact .launcher{width:560px}.compact .search-area,.compact .main-content,.compact .footer{display:none}.compact .compact-content{display:block}.playing .command-icon{color:var(--lime)}.playing .command-subtitle{color:#9eaf8c}.recording .recording-banner{display:flex}.recording .start{display:none}.stop{display:none}.recording .stop{display:flex}@keyframes pulse{50%{opacity:.35}}@keyframes wave{to{height:calc(var(--h) * .35);opacity:.4}}@media(max-height:820px){.stage{padding:80px 28px 108px}.search-area{padding-top:18px;padding-bottom:17px}.command{min-height:55px;padding-top:10px;padding-bottom:10px}.recent-group{margin-top:9px}.settings{margin-bottom:8px}.setting-row{min-height:43px;padding-top:9px;padding-bottom:9px}.toast{top:auto;bottom:105px}}@media(max-width:760px){.stage{padding-left:20px;padding-right:20px}.launcher{width:100%}.footer-right span{display:none}.command-subtitle{font-size:10px}.search-shortcut{display:none}.compact .launcher{width:100%}}

<svg style="display:none" aria-hidden="true"><defs><symbol id="tape" viewBox="0 0 24 24"><circle cx="7" cy="12" r="4"/><circle cx="17" cy="12" r="4"/><path d="M7 16h10M7 12h.01M17 12h.01"/></symbol><symbol id="record" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></symbol><symbol id="sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="#29262f"/><circle cx="15" cy="17" r="2.5" fill="#29262f"/></symbol><symbol id="file" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7zM14 3v5h4M10 12v5M13 11v7M16 13v3"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="M17 5v8H5m5-5-5 5 5 5"/></symbol><symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></symbol><symbol id="expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol><symbol id="collapse" viewBox="0 0 24 24"><path d="M3 8h5V3m8 0v5h5M8 21v-5H3m18 0h-5v5"/></symbol></defs></svg>
<div class="desktop"><div class="ambient-mark">MEETINGTAPE / LOCAL AUDIO</div></div>
<main class="stage" id="stage">
<section class="launcher" aria-label="MeetingTape 命令面板">
<div class="search-area"><div class="app-symbol"><svg><use href="#tape"/></svg></div><input id="search" aria-label="搜索指令或录音" placeholder="你想做什么？" autocomplete="off" spellcheck="false"><span class="search-shortcut">⌘ K</span></div>
<div class="main-content">
<div class="recording-banner"><span class="pulse"></span><span class="recording-label" id="liveTitle">正在录音</span><span class="recording-clock" id="clock">00:00</span><button class="compact-button" id="compactButton"><svg><use href="#collapse"/></svg>收起</button></div>
<div class="section-title">快捷指令<span class="count"></span></div>
<div class="commands" id="actions">
<button class="command start selected" data-action="start" data-search="开始录音 系统音频 麦克风"><span class="command-icon"><svg><use href="#record"/></svg></span><span class="command-copy"><span class="command-title">开始录音</span><span class="command-subtitle" style="display:block">同时记录系统音频与麦克风</span></span><span class="command-end"><span>开始</span><kbd>↵</kbd></span></button>
<button class="command stop" data-action="stop" data-search="停止录音 保存"><span class="command-icon"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg></span><span class="command-copy"><span class="command-title">停止并保存录音</span><span class="command-subtitle" style="display:block">保存到指定文件夹</span></span><span class="command-end"><span>保存</span><kbd>↵</kbd></span></button>
<button class="command" data-action="settings" data-search="录音设置 标题 输出位置 原始麦克风"><span class="command-icon"><svg><use href="#sliders"/></svg></span><span class="command-copy"><span class="command-title">录音设置</span><span class="command-subtitle" id="settingsSummary" style="display:block">未命名录音 · ~/Music/MeetingTape</span></span><span class="command-end"><kbd>⌘ ,</kbd></span></button>
</div>
<div class="settings" id="settings"><div class="setting-row"><label class="setting-label" for="title">录音标题</label><input id="title" placeholder="未命名录音" value="产品设计讨论" maxlength="80"></div><div class="setting-row"><label class="setting-label" for="output">输出位置</label><select id="output"><option value="~/Music/MeetingTape">~/Music/MeetingTape</option><option value="~/Desktop">~/Desktop</option><option value="~/Documents/会议录音">~/Documents/会议录音</option></select></div><div class="setting-row"><span class="setting-label">原始麦克风</span><span class="raw-copy">额外保留一份原始音轨</span><button class="switch" id="raw" role="switch" aria-label="保留原始麦克风" aria-checked="false"></button></div></div>
<div class="recent-group" id="recentGroup"><div class="section-title">最近录音<span class="count" id="recentCount">2 个文件</span></div><div class="commands" id="recent"></div></div>
<div class="empty" id="empty">没有匹配的指令或录音</div>
</div>
<div class="footer"><span class="footer-brand"><svg><use href="#tape"/></svg>MeetingTape</span><div class="footer-right"><span><kbd>↑ ↓</kbd>选择</span><span><kbd>↵</kbd>执行</span><button class="footer-options" id="footerOptions">选项<svg><use href="#sliders"/></svg></button></div></div>
<div class="compact-content"><div class="compact-top"><div class="compact-title"><span class="compact-dot"></span><span id="compactTitle">产品设计讨论</span></div><button class="expand" id="expandButton" aria-label="展开命令面板"><svg><use href="#expand"/></svg></button></div><div class="compact-middle"><div class="compact-time" id="compactClock">00:00</div><div class="waveform" aria-hidden="true"><i style="--h:9px;--d:.1s"></i><i style="--h:17px;--d:.4s"></i><i style="--h:26px;--d:.2s"></i><i style="--h:15px;--d:.6s"></i><i style="--h:30px;--d:.3s"></i><i style="--h:20px;--d:.5s"></i><i style="--h:12px;--d:.1s"></i><i style="--h:24px;--d:.4s"></i><i style="--h:17px;--d:.2s"></i><i style="--h:8px;--d:.5s"></i></div><button class="compact-stop" id="compactStop"><span class="stop-square"></span>停止录音</button></div><div class="compact-sources"><span><i></i>系统音频</span><span><i></i>麦克风</span><span style="margin-left:auto;color:#655c70">本地保存</span></div></div>
</section><div class="toast" role="status" id="toast"></div>
</main>
<audio id="audio" preload="metadata" src="../assets/sample-stereo.m4a"></audio>
<script src="../bridge.js"></script>
<script>
const $=id=>document.getElementById(id);
let recording=false,startedAt=0,elapsed=0,preserveRaw=false,settingsOpen=false,compact=false,selected=0,playingId=null,toastTimer;
let records=[{id:'design',title:'产品周会',duration:1932,date:'今天 10:30',size:'18.6 MB'},{id:'research',title:'用户访谈 · 第二轮',duration:2678,date:'昨天 15:00',size:'25.8 MB'}];
const time=seconds=>`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
const duration=seconds=>`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;
function report(){window.reportState({variant:'D',status:recording?'recording':playingId?'playing':'ready',recording,durationSeconds:elapsed,title:$('title').value.trim()||'未命名录音',outputPath:$('output').value,preserveRaw,settingsOpen,compact,search:$('search').value,selectedAction:visibleCommands()[selected]?.dataset.action||null,playingId,recordings:records.map(record=>({...record})),playbackSeconds:Math.floor($('audio').currentTime||0)});}
function visibleCommands(){return [...document.querySelectorAll('.command')].filter(el=>getComputedStyle(el).display!=='none'&&!el.closest('[hidden]')&&!(settingsOpen&&el.closest('.recent-group')));}
function highlight(){const commands=visibleCommands();selected=Math.max(0,Math.min(selected,commands.length-1));document.querySelectorAll('.command').forEach(el=>el.classList.remove('selected'));commands[selected]?.classList.add('selected');}
function notify(text){$('toast').textContent=text;$('toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),2600);}
function renderRecords(){const container=$('recent');container.replaceChildren();records.forEach(record=>{const wrap=document.createElement('div');wrap.className='recent-command-wrap';const button=document.createElement('button');button.className='command record-command'+(playingId===record.id?' playing':'');button.dataset.action='play:'+record.id;button.dataset.search=record.title;button.innerHTML='<span class="command-icon"><svg><use href="#file"/></svg></span><span class="command-copy"><span class="command-title"></span><span class="command-subtitle" style="display:block"></span></span><span class="command-end"></span>';button.querySelector('.command-title').textContent=record.title;button.querySelector('.command-subtitle').textContent=playingId===record.id?'正在播放 · 点击暂停':record.date+' · 双声道 AAC';button.querySelector('.command-end').textContent=playingId===record.id?'Ⅱ':duration(record.duration);button.addEventListener('click',()=>execute(button.dataset.action));const link=document.createElement('a');link.className='download';link.href='../assets/sample-stereo.m4a';link.download=record.title+'.m4a';link.setAttribute('aria-label','导出 '+record.title);link.innerHTML='<svg><use href="#download"/></svg>';link.addEventListener('click',()=>{notify('示例音频已导出');report();});wrap.append(button,link);container.append(wrap);});$('recentCount').textContent=records.length+' 个文件';filter();}
function filter(){const query=$('search').value.toLowerCase().trim();document.querySelectorAll('.command').forEach(el=>{const modeVisible=el.dataset.action==='start'?!recording:el.dataset.action==='stop'?recording:true;const match=(el.dataset.search||'').toLowerCase().includes(query);el.style.display=modeVisible&&match?'flex':'none';});const anyRecent=[...$('recent').querySelectorAll('.command')].some(el=>el.style.display!=='none');$('recentGroup').hidden=!anyRecent;$('empty').style.display=visibleCommands().length?'none':'block';highlight();report();}
function updateSummary(){const title=$('title').value.trim()||'未命名录音';$('settingsSummary').textContent=title+' · '+$('output').value;$('liveTitle').textContent=title;$('compactTitle').textContent=title;report();}
function toggleSettings(force){settingsOpen=typeof force==='boolean'?force:!settingsOpen;$('settings').classList.toggle('open',settingsOpen);$('footerOptions').textContent=settingsOpen?'收起选项':'选项';report();}
function setCompact(value){compact=value;$('stage').classList.toggle('compact',value);if(!value)$('search').focus();report();}
function stopPlayback(){if(!playingId)return;$('audio').pause();playingId=null;renderRecords();}
async function execute(action){if(action==='start'){stopPlayback();recording=true;['title','output','raw'].forEach(id=>$(id).disabled=true);elapsed=0;startedAt=Date.now();document.body.classList.add('recording');$('clock').textContent='00:00';$('compactClock').textContent='00:00';$('search').value='';selected=0;toggleSettings(false);filter();notify('已开始录音');}else if(action==='stop'){if(!recording)return;elapsed=Math.max(1,Math.floor((Date.now()-startedAt)/1000));recording=false;['title','output','raw'].forEach(id=>$(id).disabled=false);document.body.classList.remove('recording');setCompact(false);const title=$('title').value.trim()||'未命名录音';records.unshift({id:'record-'+Date.now(),title,duration:elapsed,date:'刚刚',size:'示例音频'});$('search').value='';selected=0;renderRecords();notify('已保存到 '+$('output').value);}else if(action==='settings'){toggleSettings();}else if(action.startsWith('play:')){const id=action.slice(5);if(playingId===id){stopPlayback();}else{stopPlayback();$('audio').currentTime=0;try{await $('audio').play();playingId=id;renderRecords();}catch(error){notify('示例音频暂时无法播放');}}}report();}
$('actions').querySelectorAll('.command').forEach(button=>button.addEventListener('click',()=>execute(button.dataset.action)));
$('search').addEventListener('input',()=>{if(settingsOpen)toggleSettings(false);selected=0;filter();});
$('title').addEventListener('input',updateSummary);$('output').addEventListener('change',()=>{updateSummary();notify('输出位置已更新');});
$('raw').addEventListener('click',()=>{preserveRaw=!preserveRaw;$('raw').classList.toggle('on',preserveRaw);$('raw').setAttribute('aria-checked',String(preserveRaw));report();});
$('footerOptions').addEventListener('click',()=>toggleSettings());$('compactButton').addEventListener('click',()=>setCompact(true));$('expandButton').addEventListener('click',()=>setCompact(false));$('compactStop').addEventListener('click',()=>execute('stop'));
$('audio').addEventListener('ended',()=>{playingId=null;renderRecords();});$('audio').addEventListener('timeupdate',report);
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(compact)setCompact(false);$('search').focus();return;}if((event.metaKey||event.ctrlKey)&&event.key===','){event.preventDefault();if(compact)setCompact(false);toggleSettings();return;}const editing=event.target.matches('input:not(#search),select,textarea');if(editing)return;if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();const commands=visibleCommands();selected=(selected+(event.key==='ArrowDown'?1:-1)+commands.length)%Math.max(commands.length,1);highlight();report();}else if(event.key==='Enter'&&(event.target===$('search')||event.target===document.body||event.target.closest('.command'))){event.preventDefault();if(compact){execute('stop');return;}const action=visibleCommands()[selected]?.dataset.action;if(action)execute(action);}else if(event.key==='Escape'){if($('search').value){$('search').value='';selected=0;filter();}else if(settingsOpen){toggleSettings(false);}else if(recording){setCompact(!compact);}}});
document.addEventListener('mousemove',event=>{const command=event.target.closest('.command');if(command){const next=visibleCommands().indexOf(command);if(next!==selected){selected=next;highlight();report();}}});
setInterval(()=>{if(recording){elapsed=Math.floor((Date.now()-startedAt)/1000);$('clock').textContent=time(elapsed);$('compactClock').textContent=time(elapsed);report();}},250);
renderRecords();updateSummary();report();
</script>
</body>
</html>
